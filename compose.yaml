name: expense-tracker
services:
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:?Set MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD}
      MONGO_DB: ${MONGO_DB:-tracker}
      MONGO_APP_USER: ${MONGO_APP_USER:-tracker}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?Set MONGO_APP_PASSWORD}
    volumes:
      - mongo-data:/data/db
      - ./deploy/mongo-init.js:/docker-entrypoint-initdb.d/app.js:ro
    healthcheck:
      test:
        [
          CMD-SHELL,
          'mongosh --quiet -u "$$MONGO_INITDB_ROOT_USERNAME" -p "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --eval "db.adminCommand({ping:1}).ok" | grep 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 1g
    cpus: 1.0
  api:
    image: ${IMAGE_PREFIX:-tracker}/api:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      MONGO_URI: mongodb://${MONGO_APP_USER:-tracker}:${MONGO_APP_PASSWORD}@mongo:27017/${MONGO_DB:-tracker}?authSource=${MONGO_DB:-tracker}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUST_PROXY: "true"
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    mem_limit: 384m
    cpus: 0.75
  web:
    image: ${IMAGE_PREFIX:-tracker}/web:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports: ["${APP_PORT:-80}:8080"]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8080/health]
      interval: 10s
      timeout: 3s
      retries: 5
    mem_limit: 128m
    cpus: 0.5
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [monitoring]
    restart: unless-stopped
    command:
      [
        "--config.file=/etc/prometheus/prometheus.yml",
        "--storage.tsdb.retention.time=15d",
      ]
    ports: ["127.0.0.1:9090:9090"]
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    mem_limit: 512m
  grafana:
    image: grafana/grafana:12.2.0
    profiles: [monitoring]
    restart: unless-stopped
    ports: ["127.0.0.1:3002:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/tracker.json
    volumes:
      - grafana-data:/var/lib/grafana
      - ./deploy/monitoring/grafana:/etc/grafana/provisioning:ro
      - ./deploy/monitoring/tracker.json:/var/lib/grafana/dashboards/tracker.json:ro
    mem_limit: 256m
  node-exporter:
    image: prom/node-exporter:v1.12.1
    profiles: [monitoring]
    restart: unless-stopped
    pid: host
    command:
      [
        "--path.rootfs=/host",
        "--collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+)($$|/)",
      ]
    volumes: ["/:/host:ro,rslave"]
    mem_limit: 64m
  cadvisor:
    image: ghcr.io/google/cadvisor:0.60.6
    profiles: [monitoring]
    restart: unless-stopped
    privileged: true
    command: ["--docker_only=true", "--housekeeping_interval=15s"]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    mem_limit: 256m
  blackbox:
    image: prom/blackbox-exporter:v0.29.0
    profiles: [monitoring]
    restart: unless-stopped
    volumes:
      ["./deploy/monitoring/blackbox.yml:/etc/blackbox_exporter/config.yml:ro"]
    mem_limit: 64m
volumes:
  mongo-data:
  prometheus-data:
  grafana-data:
