name: Проверки
on:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7.0
        ports: ["27017:27017"]
        options: --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'" --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      TEST_MONGO_URI: mongodb://127.0.0.1:27017/tracker_test
      MONGO_URI: mongodb://127.0.0.1:27017/tracker_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: docker compose --env-file .env.example --profile monitoring config --quiet
      - run: docker compose --env-file .env.example up -d --build --wait --wait-timeout 240
      - run: node scripts/container-smoke.mjs
      - run: docker compose --env-file .env.example --profile monitoring up -d --wait --wait-timeout 180
      - run: node scripts/monitoring-smoke.mjs
      - run: bash scripts/rollback-test.sh
      - if: failure()
        run: docker compose --env-file .env.example --profile monitoring logs --tail 100
      - if: always()
        run: docker compose --env-file .env.example --profile monitoring down
