name: Публикация и развертывание
on:
  push:
    branches: [master]
  workflow_dispatch:
concurrency:
  group: production-deployment
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      prefix: ${{ steps.image.outputs.prefix }}
    steps:
      - uses: actions/checkout@v4
      - id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "prefix=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.prefix }}/api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.prefix }}/web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
  deploy:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: SSH deployment
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          GHCR_TOKEN: ${{ secrets.GHCR_READ_TOKEN || github.token }}
          GHCR_USER: ${{ github.actor }}
          IMAGE_PREFIX: ${{ needs.publish.outputs.prefix }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          # Validated release paths and registry arguments intentionally expand on the runner.
          set -Eeuo pipefail
          [[ "$SSH_HOST" =~ ^[a-zA-Z0-9.-]+$ && "$SSH_USER" =~ ^[a-zA-Z0-9_-]+$ && "$SSH_PORT" =~ ^[0-9]+$ ]]
          [[ "$GHCR_USER" =~ ^[a-zA-Z0-9_-]+$ ]]
          [[ "$IMAGE_PREFIX" =~ ^ghcr.io/[a-z0-9._/-]+$ && "$COMMIT_SHA" =~ ^[a-f0-9]{40}$ ]]
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh_opts=(-i ~/.ssh/deploy_key -p "$SSH_PORT" -o StrictHostKeyChecking=yes -o BatchMode=yes)
          remote="$SSH_USER@$SSH_HOST"
          release="/opt/expense-tracker/releases/$COMMIT_SHA"
          # shellcheck disable=SC2029
          ssh "${ssh_opts[@]}" "$remote" "mkdir -p '$release'"
          # shellcheck disable=SC2029
          tar -czf - compose.yaml deploy | ssh "${ssh_opts[@]}" "$remote" "tar -xzf - -C '$release'"
          # shellcheck disable=SC2029
          printf '%s' "$GHCR_TOKEN" | ssh "${ssh_opts[@]}" "$remote" "docker login ghcr.io --username '$GHCR_USER' --password-stdin"
          # shellcheck disable=SC2029
          ssh "${ssh_opts[@]}" "$remote" "bash '$release/deploy/deploy.sh' '$IMAGE_PREFIX'"
